              SELECT t.id, v.keyword, v.tier
              FROM (VALUES
                ('COOKIE_POLICY', 'Cookie Notice', 'ENGLISH_FALLBACK'),
                ('COOKIE_POLICY', 'Cookie Policy', 'ENGLISH_FALLBACK'),
                ('COOKIE_POLICY', 'Cookies', 'ENGLISH_FALLBACK'),
                ('GDPR_REQUEST', 'Data Request', 'ENGLISH_FALLBACK'),
