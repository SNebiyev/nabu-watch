databaseChangeLog:
  - changeSet:
      id: 010-seed-compliance-regions
      author: nabu
      comment: Supported compliance regions; GLOBAL is the default.
      changes:
        - sql:
            sql: |
              INSERT INTO compliance_regions (code, name, active, global_default) VALUES
                ('GLOBAL', 'Global (Default)', true, true),
                ('AT', 'Austria', true, false),
                ('BR', 'Brazil', true, false),
                ('CA', 'Canada', true, false),
                ('CH', 'Switzerland', true, false),
                ('DE', 'Germany', true, false),
                ('ES', 'Spain', true, false),
                ('FR', 'France', true, false),
                ('GB', 'United Kingdom', true, false),
                ('IT', 'Italy', true, false),
                ('NL', 'Netherlands', true, false),
                ('PL', 'Poland', true, false),
                ('US', 'United States', true, false);
  - changeSet:
      id: 010-seed-compliance-monitor-types
      author: nabu
      comment: Compliance document types checked per region.
      changes:
        - sql:
            sql: |
              INSERT INTO compliance_monitor_types (sub_type_code, default_name, description) VALUES
                ('COOKIE_BANNER', 'Cookie Consent Banner', 'Verifies that a GDPR/ePrivacy-compliant cookie consent banner is present with functional accept and reject controls. Handled by BannerScanner — no keyword payload required.'),
                ('COOKIE_POLICY', 'Cookie Policy', 'Cookie consent and tracking disclosure required by ePrivacy Directive.'),
                ('GDPR_REQUEST', 'GDPR Data Request', 'Data subject rights contact / request mechanism under GDPR Art. 17.'),
                ('IMPRESSUM', 'Impressum / Legal Notice', 'Mandatory legal publisher identification (required in DACH and other EU markets).'),
                ('PRIVACY_POLICY', 'Privacy Policy', 'Data privacy disclosure required by GDPR, CCPA, and equivalent regulations.'),
                ('TERMS_OF_SERVICE', 'Terms of Service', 'User agreement governing access to the service.'),
                ('TRACKER_DETECTION', 'Third-Party Tracker Detection', 'Detects undisclosed third-party trackers (analytics, advertising, social, fingerprinting, etc.) loaded by the website via headless Chrome network interception.');
