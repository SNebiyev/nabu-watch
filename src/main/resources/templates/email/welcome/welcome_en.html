<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<div style="max-width:480px;margin:40px auto;background-color:#1e293b;border-radius:16px;border:1px solid #334155;padding:40px;">
    <div style="text-align:center;margin-bottom:32px;">
        <h1 style="color:#f8fafc;font-size:20px;margin:0;">Nabu Watch</h1>
    </div>
    <h2 style="color:#f1f5f9;font-size:18px;margin:0 0 16px;">Welcome to Nabu Watch!</h2>
    <p style="color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 24px;">
        Hi {{userName}}, your account has been verified successfully. You're all set to start
        monitoring your websites for compliance.
    </p>
    <div style="text-align:center;margin:32px 0;">
        <a style="display:inline-block;padding:12px 32px;background-color:#0ea5e9;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;"
           href="{{dashboardUrl}}">
            Go to Dashboard
        </a>
    </div>
    <hr style="border:none;border-top:1px solid #334155;margin:32px 0 16px;"/>
    <p style="color:#475569;font-size:11px;text-align:center;margin:0;">
        Nabu Watch — Compliance Monitoring Platform
    </p>
</div>
</body>
</html>
